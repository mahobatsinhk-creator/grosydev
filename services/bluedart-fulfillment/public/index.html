<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grosyhub — Blue Dart Fulfillment</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #1a1a1a;
      background: #f6f4f1;
    }
    body { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: #666; margin-bottom: 24px; font-size: 0.95rem; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #444; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1; min-width: 180px; }
    button { background: #b89774; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    button.secondary { background: #eee; color: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eee; vertical-align: middle; }
    th:last-child, td.actions { min-width: 280px; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .actions button { padding: 7px 10px; white-space: nowrap; }
    .actions a { text-decoration: none; }
    tr.fulfilled-row { background: #f3faf3; }
    tr.fulfilled-row td { border-bottom-color: #c8e6c9; }
    .print-links {
      font-size: 0.78rem;
      margin-top: 5px;
      line-height: 1.45;
    }
    .print-links a {
      color: #1565c0;
      font-weight: 600;
      text-decoration: none;
    }
    .print-links a:hover { text-decoration: underline; }
    button.btn-print { background: #2e7d32; }
    button.btn-label { background: #1565c0; }
    .order-link {
      color: #1a1a1a;
      font-weight: 700;
      text-decoration: none;
    }
    .order-link:hover { color: #1565c0; text-decoration: underline; }
    .generated-meta { font-size: 0.78rem; color: #666; margin-top: 2px; }
    .row-msg { font-size: 0.8rem; margin-top: 4px; padding: 6px 8px; border-radius: 6px; }
    .row-msg.ok { background: #e8f5e9; color: #1b5e20; }
    .row-msg.err { background: #ffebee; color: #b71c1c; }
    .msg { padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 0.9rem; }
    .msg.ok { background: #e8f5e9; color: #1b5e20; }
    .msg.err { background: #ffebee; color: #b71c1c; }
    code { background: #f0ece6; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Blue Dart Fulfillment</h1>
  <p class="sub">Post-checkout only — Shiprocket fast checkout stays untouched.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="secret">API secret <small style="color:#888">(saved in browser)</small></label>
        <input id="secret" type="password" placeholder="Auto-saved after first use" autocomplete="off" />
      </div>
      <div style="flex:0;display:flex;gap:8px;align-items:flex-end">
        <button type="button" id="loadBtn">Refresh unfulfilled orders</button>
        <button type="button" class="secondary" id="batchBtn">Fulfill all</button>
      </div>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="generatedCard">
    <div class="row" style="align-items:center;margin-bottom:12px">
      <div style="flex:2">
        <h2 style="margin:0;font-size:1.1rem">Generated labels — all orders</h2>
        <p class="sub" style="margin:4px 0 0">Click order number to open packing slip · print label anytime</p>
      </div>
      <div style="flex:1;min-width:140px">
        <label for="generatedSearch">Search order / AWB</label>
        <input id="generatedSearch" placeholder="e.g. 1496" />
      </div>
      <div style="flex:0">
        <button type="button" class="secondary" id="loadGeneratedBtn" style="margin-top:18px">Refresh list</button>
      </div>
    </div>
    <div id="generatedList">Loading generated orders…</div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;font-size:1.1rem">Unfulfilled orders</h2>
    <div id="orders">Loading orders…</div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;font-size:1.1rem">Manual fulfill (optional)</h2>
    <div class="row">
      <div>
        <label for="orderId">Order name or ID (e.g. 1458 or #1458)</label>
        <input id="orderId" placeholder="1458" />
      </div>
      <div style="flex:0;display:flex;gap:8px">
        <button type="button" class="secondary" id="dryRunBtn">Preview</button>
        <button type="button" id="fulfillBtn">Create AWB &amp; fulfill</button>
      </div>
    </div>
    <div id="manualResult"></div>
  </div>

  <script>
    const secretEl = document.getElementById('secret');
    const statusEl = document.getElementById('status');
    const ordersEl = document.getElementById('orders');
    const manualResultEl = document.getElementById('manualResult');
    const generatedListEl = document.getElementById('generatedList');
    const generatedSearchEl = document.getElementById('generatedSearch');
    let generatedSearchTimer = null;

    function headers() {
      const h = { 'Content-Type': 'application/json' };
      if (secretEl.value.trim()) h['X-Api-Secret'] = secretEl.value.trim();
      return h;
    }

    function show(el, text, ok) {
      el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
    }

    function successHtml(data) {
      const slip = data.packingSlipUrl || '/api/packing-slip/' + data.awb;
      const label = data.labelPrintUrl || '/api/print-label/' + data.awb;
      return `AWB <code>${data.awb}</code> created —
        <a href="${slip}" target="_blank" rel="noopener"><strong>Print packing slip</strong></a> ·
        <a href="${label}" target="_blank" rel="noopener"><strong>Print label</strong></a> ·
        <a href="${data.trackingUrl}" target="_blank" rel="noopener">Track</a>`;
    }

    function printButtonsHtml(data, compact) {
      const slip = data.packingSlipUrl || '/api/packing-slip/' + data.awb;
      const label = data.labelPrintUrl || '/api/print-label/' + data.awb;
      if (compact) {
        return `<a href="${slip}" target="_blank" rel="noopener">Packing slip</a> · <a href="${label}" target="_blank" rel="noopener">Print label</a>`;
      }
      return `
        <a href="${slip}" target="_blank" rel="noopener"><button type="button" class="btn-print">Packing slip</button></a>
        <a href="${label}" target="_blank" rel="noopener"><button type="button" class="btn-label">Print label</button></a>
        <a href="${data.trackingUrl}" target="_blank" rel="noopener"><button type="button" class="secondary">Track</button></a>`;
    }

    function bindGeneratedRows(data) {
      if (!data.orders.length) {
        generatedListEl.innerHTML = '<p>No generated labels yet. Create an AWB above — it will appear here.</p>';
        return;
      }
      generatedListEl.innerHTML = `<div class="table-wrap"><table>
        <thead><tr>
          <th>Order</th><th>Customer</th><th>AWB</th><th>Created</th><th>Print</th>
        </tr></thead>
        <tbody>${data.orders.map((o) => {
          const slip = o.packingSlipUrl || '/api/packing-slip/' + o.awb;
          const created = o.createdAt ? new Date(o.createdAt).toLocaleString() : '—';
          const name = o.orderName && o.orderName !== '—' ? o.orderName : o.awb;
          return `
          <tr>
            <td>
              <a class="order-link" href="${slip}" target="_blank" rel="noopener">${name}</a>
              ${o.total ? `<div class="generated-meta">₹${o.total}</div>` : ''}
            </td>
            <td>${o.customer || '—'}</td>
            <td><code>${o.awb}</code></td>
            <td style="font-size:0.8rem">${created}</td>
            <td class="actions">${printButtonsHtml(o)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
      <p style="margin-top:10px;font-size:0.85rem;color:#666">${data.orders.length} shown${data.total > data.orders.length ? ` of ${data.total}` : ''} · updated ${new Date().toLocaleTimeString()}</p>`;
    }

    async function loadGeneratedOrders() {
      saveSecret();
      try {
        const q = generatedSearchEl.value.trim();
        const path = '/api/orders/generated?limit=200' + (q ? '&search=' + encodeURIComponent(q) : '');
        generatedListEl.innerHTML = '<p>Loading…</p>';
        const data = await api(path);
        bindGeneratedRows(data);
      } catch (e) {
        generatedListEl.innerHTML = `<p class="msg err">${e.message}</p>`;
      }
    }

    function refreshAfterFulfill() {
      loadGeneratedOrders();
    }

    function markRowFulfilled(tr, orderId, data) {
      if (!tr) return;
      const orderName = tr.querySelector('strong')?.textContent || data.order?.name || orderId;
      const slip = data.packingSlipUrl || '/api/packing-slip/' + data.awb;

      tr.querySelector('td:first-child').innerHTML = `
        <a class="order-link" href="${slip}" target="_blank" rel="noopener">${orderName}</a>
        <div class="print-links">
          AWB <code>${data.awb}</code><br>
          ${printButtonsHtml(data, true)}
        </div>`;

      tr.querySelector('.actions').innerHTML = printButtonsHtml(data);
      tr.classList.add('fulfilled-row');
      refreshAfterFulfill();
    }

    function manualSuccessHtml(data) {
      return `<div class="msg ok" style="margin-top:12px">
        ${successHtml(data)}
        <div class="actions" style="margin-top:10px">${printButtonsHtml(data)}</div>
      </div>`;
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { ...options, headers: { ...headers(), ...options.headers } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    async function fulfillOrder(orderId, dryRun, resultEl, buttons) {
      if (!orderId) {
        if (resultEl) show(resultEl, 'Missing order ID.', false);
        return;
      }
      const row = resultEl?.closest('tr');
      buttons?.forEach((b) => (b.disabled = true));
      try {
        if (resultEl) {
          resultEl.innerHTML = `<div class="row-msg ok">${dryRun ? 'Building preview…' : 'Creating Blue Dart AWB…'}</div>`;
        }
        const data = await api('/api/fulfill', {
          method: 'POST',
          body: JSON.stringify({ orderId, dryRun }),
        });
        if (dryRun) {
          if (resultEl) {
            resultEl.innerHTML = `<div class="row-msg ok"><pre style="white-space:pre-wrap;margin:0;font-size:0.75rem">${JSON.stringify(data, null, 2)}</pre></div>`;
          }
        } else {
          if (row) {
            markRowFulfilled(row, orderId, data);
          } else if (resultEl === manualResultEl) {
            manualResultEl.innerHTML = manualSuccessHtml(data);
            refreshAfterFulfill();
          } else if (resultEl) {
            resultEl.innerHTML = `<div class="row-msg ok">${successHtml(data)}</div>`;
          }
        }
        return data;
      } catch (e) {
        if (resultEl) {
          resultEl.innerHTML = `<div class="row-msg err">${e.message}</div>`;
        }
        throw e;
      } finally {
        if (!row || dryRun) {
          buttons?.forEach((b) => (b.disabled = false));
        }
      }
    }

    const SECRET_STORAGE_KEY = 'grosyhub-bd-api-secret';

    function saveSecret() {
      const v = secretEl.value.trim();
      if (v) localStorage.setItem(SECRET_STORAGE_KEY, v);
    }

    function loadSecret() {
      const saved = localStorage.getItem(SECRET_STORAGE_KEY);
      if (saved) secretEl.value = saved;
    }

    secretEl.addEventListener('input', saveSecret);
    secretEl.addEventListener('change', saveSecret);

    function bindOrderRows(data) {
      if (!data.orders.length) {
        ordersEl.innerHTML = '<p>No unfulfilled orders.</p>';
        return;
      }
      ordersEl.innerHTML = `<div class="table-wrap"><table>
        <thead><tr>
          <th>Order</th><th>Customer</th><th>Pincode</th><th>Total</th><th>Actions</th>
        </tr></thead>
        <tbody>${data.orders.map((o) => `
          <tr data-row="${o.id}">
            <td><strong>${o.name}</strong></td>
            <td>${o.customer || '—'}</td>
            <td>${o.pincode || '—'}</td>
            <td>₹${o.total}</td>
            <td class="actions">
              <button type="button" class="secondary btn-preview" data-order-id="${o.id}">Preview</button>
              <button type="button" class="btn-fulfill" data-order-id="${o.id}">Create AWB &amp; fulfill</button>
              <div class="row-result" id="result-${o.id}"></div>
            </td>
          </tr>`).join('')}</tbody>
      </table></div>
      <p style="margin-top:10px;font-size:0.85rem;color:#666">${data.orders.length} unfulfilled order(s) · updated ${new Date().toLocaleTimeString()}</p>`;

      ordersEl.querySelectorAll('.btn-preview').forEach((btn) => {
        btn.onclick = () => {
          const id = btn.dataset.orderId;
          const resultEl = document.getElementById('result-' + id);
          const rowButtons = btn.closest('.actions').querySelectorAll('button');
          fulfillOrder(id, true, resultEl, [...rowButtons]);
        };
      });

      ordersEl.querySelectorAll('.btn-fulfill').forEach((btn) => {
        btn.onclick = () => {
          const id = btn.dataset.orderId;
          const name = btn.closest('tr').querySelector('strong')?.textContent || id;
          if (!confirm(`Create Blue Dart AWB for ${name}?`)) return;
          const resultEl = document.getElementById('result-' + id);
          const rowButtons = btn.closest('.actions').querySelectorAll('button');
          fulfillOrder(id, false, resultEl, [...rowButtons]);
        };
      });
    }

    async function loadOrders() {
      saveSecret();
      try {
        statusEl.textContent = 'Refreshing orders…';
        ordersEl.innerHTML = '<p>Loading…</p>';
        const data = await api('/api/orders/unfulfilled');
        bindOrderRows(data);
        statusEl.innerHTML = `<div class="msg ok" style="margin-top:8px">Orders refreshed (${data.orders.length} unfulfilled)</div>`;
        setTimeout(() => { statusEl.textContent = ''; }, 2500);
      } catch (e) {
        show(statusEl, e.message, false);
        ordersEl.innerHTML = '<p>Could not load orders. Check API secret and try Refresh.</p>';
      }
    }

    document.getElementById('loadBtn').onclick = () => {
      loadOrders();
      loadGeneratedOrders();
    };
    document.getElementById('loadGeneratedBtn').onclick = () => loadGeneratedOrders();
    generatedSearchEl.addEventListener('input', () => {
      clearTimeout(generatedSearchTimer);
      generatedSearchTimer = setTimeout(loadGeneratedOrders, 300);
    });

    async function runFulfill(dryRun) {
      const orderId = document.getElementById('orderId').value.trim();
      await fulfillOrder(orderId, dryRun, manualResultEl, null);
    }

    document.getElementById('dryRunBtn').onclick = () => runFulfill(true);
    document.getElementById('fulfillBtn').onclick = () => runFulfill(false);

    document.getElementById('batchBtn').onclick = async () => {
      if (!confirm('Create Blue Dart AWBs for ALL unfulfilled orders?')) return;
      try {
        show(statusEl, 'Processing all unfulfilled orders…', true);
        const data = await api('/api/fulfill/batch', { method: 'POST', body: '{}' });
        const okRows = (data.results || []).filter((r) => r.ok);
        show(
          statusEl,
          `Batch done: ${data.success} succeeded, ${data.failed} failed (of ${data.processed})`,
          data.failed === 0
        );
        loadOrders();
        loadGeneratedOrders();
      } catch (e) {
        show(statusEl, e.message, false);
      }
    };

    // Auto-fill secret + load orders on open
    loadSecret();
    if (!secretEl.value.trim()) {
      secretEl.value = 'grosyhub-local-dev-secret';
      saveSecret();
    }
    loadGeneratedOrders();
    loadOrders();
  </script>
</body>
</html>
